version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: streamlit run src/ui/dashboard.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pg_data: